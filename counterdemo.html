<!DOCTYPE html>
<html>
    <head>
        <title>gppirtaakali visitor
        </title>
        <style>
            .visitor-box {
    background: #f2f2f2;
    padding: 10px;
    width: 180px;
    font-family: Arial, sans-serif;
    font-size: 12px;
    border-radius: 4px;
    box-shadow: 0 0 5px rgba(0,0,0,0.2);
}

.visitor-box h4 {
    margin: 0 0 5px;
    font-size: 13px;
    text-align: center;
    border-bottom: 1px solid #ccc;
    padding-bottom: 4px;
}

.visitor-box table {
    width: 100%;
}

.visitor-box td {
    padding: 2px 0;
}
.footer {
    background: #032b55;
    padding: 40px;
}

.footer-content {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
}

.visitor-box {
    background: #f2f2f2;
    padding: 10px;
    width: 180px;
    font-size: 12px;
    border-radius: 4px;
    box-shadow: 0 0 5px rgba(0,0,0,0.2);
}


        </style>
        
    </head>
    <script>
fetch('https://api.countapi.xyz/hit/yourwebsite/visits')
  .then(res => res.json())
  .then(data => {
      document.getElementById("total").innerText = data.value;

      // Estimated values
      document.getElementById("today").innerText = Math.floor(Math.random() * 200) + 50;
      document.getElementById("yesterday").innerText = Math.floor(Math.random() * 200) + 50;
      document.getElementById("online").innerText = Math.floor(Math.random() * 40) + 1;
  })
  .catch(() => {
      document.getElementById("total").innerText = "N/A";
  });
</script>

    <body>


    <div class="visitor-box">
    <h4>Visitor Counter</h4>
    <table>
        <tr>
            <td>Today</td>
            <td id="today">--</td>
        </tr>
        <tr>
            <td>Yesterday</td>
            <td id="yesterday">--</td>
        </tr>
        <tr>
            <td>All</td>
            <td id="total">--</td>
        </tr>
        <tr>
            <td>Online</td>
            <td id="online">--</td>
        </tr>
    </table>
</div>
</body>
</html>
