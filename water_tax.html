
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>QR code</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
    }

    .gallery-page {
      padding: 40px;
      max-width: 1200px;
      margin: auto;
    }

    .gallery-page h1 {
      text-align: center;
      color: #0a3d62;
    }

    .subtitle {
      text-align: center;
      color: #555;
      margin-bottom: 30px;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .gallery-item {
      background: #ffffff;
      border: 1px solid #ddd;
      border-radius: 6px;
      overflow: hidden;
      transition: transform 0.3s;
    }

    .gallery-item:hover {
      transform: scale(1.02);
    }

    .gallery-item img {
      width: 60%;
      height: 900px;
      object-fit: cover;
      cursor: pointer;
    }

    .gallery-item p {
      padding: 10px;
      font-size: 14px;
      color: #333;
      text-align: center;
      margin: 0;
    }
  </style>

</head>
<body>

  <section class="gallery-page">
    <h1>कर संकलन QR कोड</h1>
    <p class="subtitle"></p>
    <h2></h2>
    <div class="gallery-grid">

      

      <div class="gallery-item">
        <img src="pani_purvatha_QRcode.jpeg" alt="">
        <p><b>पाणीपुरवठा करासाठीचा भरणा करण्यासाठी या QR कोडचा वापर करा</b></p>
      </div>
    </div>
</section></body>
