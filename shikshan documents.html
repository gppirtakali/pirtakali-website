<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<title>school documents</title>

<style>
/* RESET */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

/* BODY */
body {
  font-family: "Noto Sans Devanagari", Arial, sans-serif;
  background: #f4f4f4;
  color: #222;
}

/* HEADER */
.top-bar {
  background: #ffffff;
  padding: 10px 16px;
  border-bottom: 1px solid #ddd;
}

.gov-title {
  font-size: 14px;
  font-weight: bold;
}

/* NAVBAR */
.navbar {
  background: #1b8f3a;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 16px;
}

.navbar ul {
  list-style: none;
  display: flex;
  gap: 20px;
}

.navbar ul li {
  color: #fff;
  font-size: 14px;
  cursor: pointer;
}

.navbar ul li.active {
  background: #f7b500;
  color: #000;
  padding: 6px 10px;
  border-radius: 4px;
}

/* CONTAINER */
.container {
  background: #fff;
  max-width: 1100px;
  margin: 16px auto;
  padding: 20px;
}

/* BREADCRUMB */
.breadcrumb {
  font-size: 13px;
  color: #666;
  margin-bottom: 10px;
}

/* PAGE TITLE */
.page-title {
  font-size: 26px;
  font-weight: bold;
  margin-bottom: 20px;
}

/* FILTER BAR */
.filter-box {
  display: flex;
  align-items: center;
  background: #e6e6e6;
  padding: 10px;
  margin-bottom: 20px;
}

.filter-label {
  background: #1b8f3a;
  color: #fff;
  padding: 10px 16px;
  font-size: 14px;
  margin-right: 10px;
}

.filter-box input {
  flex: 1;
  padding: 8px;
  border: 1px solid #ccc;
}

.filter-box button {
  background: #1b8f3a;
  color: #fff;
  border: none;
  padding: 8px 14px;
  margin-left: 10px;
  cursor: pointer;
}

/* SECTION HEADER */
.section-header {
  background: #2d2d2d;
  color: #fff;
  padding: 10px 16px;
  font-size: 16px;
  margin-bottom: 10px;
}

/* DOCUMENT LIST */
.doc-item {
  padding: 16px;
  border-bottom: 1px solid #ddd;
}

.doc-title {
  font-weight: bold;
  margin-bottom: 6px;
}

.doc-meta {
  font-size: 14px;
  margin-bottom: 6px;
}

.doc-link {
  font-size: 14px;
}

.doc-link a {
  color: #1b8f3a;
  text-decoration: none;
  font-weight: bold;
}

.doc-link span {
  color: #666;
  margin-left: 6px;
}

/* DOWNLOAD ICON */
.download {
  color: #1b8f3a;
  font-size: 16px;
  margin-left: 8px;
}

/* MOBILE */
@media (max-width: 768px) {
  .navbar ul {
    flex-wrap: wrap;
    gap: 10px;
  }

  .page-title {
    font-size: 22px;
  }
}
</style>
</head>



<body>



<!-- CONTENT -->

</html>
