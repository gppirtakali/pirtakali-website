    .header {
        background-color: #4e9a2f;

    .tabs {
        display: flex;

    }
    /* Individual Tab */
    .tab {
        flex: 1;
        text-align: center;
        padding: 14px 0;
        font-size: 20px;
        color: white;
        border-right: 2px solid #4e9a2f;
        cursor: pointer;
    }
    /* Remove last border */
    .tab:last-child {
        border-right: none;
    }
    .box a,
.box a:visited,
.box a:hover,

  color: white;
}
.content-area {
  padding: 40px 60px;

}
.content-row {
  display: flex;
  align-items:;
  gap: 40px;

}
.content-row.reverse {
  flex-direction: row-reverse;
}
/* Logo Card */
.logo-card {
  width: 140px;
  height: 140px;
  background: #9be88c;
  border-radius: 6px;
  text-align: center;
  padding: 15px;
  box-shadow: 0 6px 14px rgba(0,0,0,0.15);
}
.logo-card img {
  width: 70px;
  margin-bottom: 8px;
}
.logo-card p {
  font-size: 18px;
  font-weight: 600;
  color: #0b3d0b;
}
/* Text */
.text-box {
  flex: 1;
  font-size: 17px;
  line-height: 1.8;
  color: #000000;
  font-family: "Noto Sans Devanagari", sans-serif;
}
/* Responsive */
@media (max-width: 768px) {
  .content-row,
  .content-row.reverse {
    flex-direction: column;
  }
  .content-area {
    padding: 25px;
  }
  .logo-card {
    margin-bottom: 15px;
  }
}
/* Header */
.header {
  display: flex;

  padding: 15px 25px;
  background-color: #8ac5ef;
}
body {
    background: linear-gradient(135deg, #f5f9ff, #eef6f3);
}
.header-text {
  text-align: left;       /* text stays neat */
}
.fade-slider {
  position: relative;
  width: 100%;
  height: 550px;
}
.fade-slider img {
  position: absolute;
  width: 100%;
  height: 100%;
  opacity: 0;
  animation: fade 17s infinite;
}
.fade-slider img:nth-child(1) { animation-delay: 0s; }
.fade-slider img:nth-child(2) { animation-delay: 3s; }
.fade-slider img:nth-child(3) { animation-delay: 6s; }
.fade-slider img:nth-child(4) { animation-delay: 9s; }
.fade-slider img:nth-child(5) { animation-delay: 12s; }
.fade-slider img:nth-child(6) { animation-delay: 15s; }

@keyframes fade {
  0% { opacity: 0; }
  10% { opacity: 1; }
  30% { opacity: 1; }
  40% { opacity: 0; }
  70%{ opacity: 0;}
  100% { opacity: 0; }
}
/* ---------- FADE SLIDER – CINEMATIC GOVERNANCE ---------- */
.fade-slider {
  border-radius: 28px;
  overflow: hidden;
}
.fade-slider::after {
  content: "Government Initiatives & Village Life";
  position: absolute;
  bottom: 20px;
  left: 30px;
  color: #ffffff;
  font-size: 14px;
  letter-spacing: 0.4px;
  opacity: 0.85;

</style>
