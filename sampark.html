                body {

    /* Top Header */
    .header {
        background-color: #4e9a2f;
        color: white;
        text-align: center;
        padding: 18px 0;
        font-size: 26px;
        font-weight: 500;
    }

    /* Tabs Container */
    .tabs {
        display: flex;
        background-color: #6fbf5b;
    }

    /* Individual Tab */
    .tab {
        flex: 1;
        text-align: center;
        padding: 14px 0;
        font-size: 20px;
        color: white;
        border-right: 2px solid #4e9a2f;
        cursor: pointer;
    }

    /* Remove last border */
    .tab:last-child {
        border-right: none;
    }
    .box a,
.box a:visited,
.box a:hover,
.box a:active {
  color: white;
}
.content-area {
  padding: 40px 60px;
  background: #ffffff;
}

.content-row {
  display: flex;
  align-items:;
  gap: 40px;
  margin-bottom: 40px;
}

.content-row.reverse {
  flex-direction: row-reverse;
}

/* Logo Card */
.logo-card {
  width: 140px;
  height: 140px;
  background: #9be88c;
  border-radius: 6px;
  text-align: center;
  padding: 15px;
  box-shadow: 0 6px 14px rgba(0,0,0,0.15);
}

.logo-card img {
  width: 70px;
  margin-bottom: 8px;
}

.logo-card p {
  font-size: 18px;
  font-weight: 600;
  color: #0b3d0b;
}

/* Text */

  font-size: 17px;
  line-height: 1.8;
  color: #0b3d0b;
  font-family: "Noto Sans Devanagari", sans-serif;
}

/* Responsive */
@media (max-width: 768px) {
  .content-row,
  .content-row.reverse {
    flex-direction: column;
  }
  .content-area {
    padding: 25px;
  }
  .logo-card {
    margin-bottom: 15px;
  }
}

}

body {

}

.header-text {
  text-align: left;       /* text stays neat */
}
